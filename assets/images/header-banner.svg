<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="50%" stop-color="#080e1e" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Text Gradients -->
    <linearGradient id="name-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="wave-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="wave-grad-2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.4" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtle-blur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="80" />
    </filter>

    <!-- Pattern Grid -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.03)" stroke-width="1" />
      <circle cx="40" cy="40" r="1.2" fill="rgba(56, 189, 248, 0.25)" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="320" rx="16" fill="url(#bg-grad)" />

  <!-- Ambient Orbs -->
  <circle cx="200" cy="60" r="160" fill="#38bdf8" opacity="0.12" filter="url(#subtle-blur)" />
  <circle cx="1000" cy="120" r="180" fill="#818cf8" opacity="0.1" filter="url(#subtle-blur)" />
  <circle cx="600" cy="280" r="140" fill="#a855f7" opacity="0.08" filter="url(#subtle-blur)" />

  <!-- Grid Overlay -->
  <rect width="1200" height="320" rx="16" fill="url(#grid-pattern)" />

  <!-- Border Highlight -->
  <rect width="1198" height="318" x="1" y="1" rx="15" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1.5" />

  <!-- Flowing Waves at Bottom -->
  <path d="M 0,260 C 250,220 450,290 700,240 C 950,190 1100,270 1200,240 L 1200,320 L 0,320 Z" fill="url(#wave-grad-2)" />
  <path d="M 0,275 C 300,235 550,300 800,255 C 1000,220 1120,285 1200,265 L 1200,320 L 0,320 Z" fill="url(#wave-grad-1)" opacity="0.85" />

  <!-- Content Elements -->
  <!-- Top Badge -->
  <g transform="translate(600, 48)">
    <rect x="-180" y="-16" width="360" height="32" rx="16" fill="rgba(56, 189, 248, 0.08)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.2" />
    <circle cx="-152" cy="0" r="4.5" fill="#10b981" />
    <circle cx="-152" cy="0" r="8" fill="#10b981" opacity="0.3" />
    <text x="-136" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#38bdf8" letter-spacing="1.5">SENIOR SOFTWARE ENGINEER • 6+ YEARS</text>
  </g>

  <!-- Main Name Title -->
  <g transform="translate(600, 128)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="56" font-weight="800" fill="url(#name-grad)" letter-spacing="-1">
      Ayush Gupta
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 168)">
    <text text-anchor="middle" font-family="'JetBrains Mono', Consolas, Monaco, monospace" font-size="18" font-weight="500" fill="#cbd5e1" letter-spacing="0.5">
      Full-Stack Architecture  <tspan fill="#38bdf8">•</tspan>  Distributed Microservices  <tspan fill="#38bdf8">•</tspan>  Agentic AI &amp; RAG
    </text>
  </g>

  <!-- Skill Pill Tags -->
  <g transform="translate(600, 218)">
    <!-- Java & Spring Boot -->
    <g transform="translate(-390, 0)">
      <rect x="0" y="-14" width="135" height="28" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text x="67" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#f1f5f9">☕ Spring Boot</text>
    </g>

    <!-- React & TypeScript -->
    <g transform="translate(-240, 0)">
      <rect x="0" y="-14" width="130" height="28" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text x="65" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#f1f5f9">⚛️ React &amp; TS</text>
    </g>

    <!-- Python & FastAPI -->
    <g transform="translate(-95, 0)">
      <rect x="0" y="-14" width="130" height="28" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text x="65" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#f1f5f9">🐍 Python FastAPI</text>
    </g>

    <!-- LangChain & RAG -->
    <g transform="translate(50, 0)">
      <rect x="0" y="-14" width="130" height="28" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1" />
      <text x="65" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#38bdf8">🤖 Agentic RAG</text>
    </g>

    <!-- Kafka & Cloud -->
    <g transform="translate(195, 0)">
      <rect x="0" y="-14" width="125" height="28" rx="14" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
      <text x="62" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="600" fill="#f1f5f9">📡 Apache Kafka</text>
    </g>

    <!-- C-DAC -->
    <g transform="translate(335, 0)">
      <rect x="0" y="-14" width="95" height="28" rx="14" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1" />
      <text x="47" y="4" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#a5b4fc">🏛️ C-DAC</text>
    </g>
  </g>
</svg>
